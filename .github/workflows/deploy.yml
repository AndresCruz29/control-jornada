name: Deploy Control de Jornada

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-jornada-pwa/package-lock.json

      - name: Instalar dependencias
        working-directory: ./control-jornada-pwa
        run: npm install

      - name: Compilar aplicación
        working-directory: ./control-jornada-pwa
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./control-jornada-pwa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
